name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  integrity:
    name: Deterministic integrity audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pillow
      - name: Generate controlled metadata and citation artifacts
        run: |
          python scripts/generate-page-metadata.py
          python scripts/generate-citation-artifacts.py
      - name: Build with Eleventy
        run: npm run build
      - name: Run deterministic integrity audit
        run: python scripts/audit-routes.py _site

  build:
    if: github.event_name != 'pull_request'
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate controlled metadata and citation artifacts
        run: |
          python scripts/generate-page-metadata.py
          python scripts/generate-citation-artifacts.py
      - name: Build with Eleventy
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
